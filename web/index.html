<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The package's default surfaces; the app repaints them from the chosen theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9fe" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0e12" />
    <meta name="robots" content="noindex" />
    <!-- Profile photos come from ITMO hosts: they must not learn which page shows them. -->
    <meta name="referrer" content="same-origin" />
    <title>ITMO.Widgets</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
