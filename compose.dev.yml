# Caddy sends everything except /api/* on dev.widgets.alllexey.dev here.
# See README.md for deployment from a git archive, not a server checkout.
name: itmowidgets-web-dev

services:
  itmowidgets-web-dev:
    build: .
    image: itmowidgets-web:dev
    container_name: itmowidgets-web-dev
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true
    name: web
