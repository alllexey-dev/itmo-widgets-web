# Landing (/) and web app (/app/) behind Caddy; /api/* goes to Backend.
# This builds the combined image locally. Current production uses mounted files;
# see README.md for the owner-approved deployment procedure until WB-06.
services:
  itmowidgets-web:
    build: .
    image: itmowidgets-web:local
    container_name: itmowidgets-web
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true
    name: web
