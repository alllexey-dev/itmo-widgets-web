# widgets.alllexey.dev without /api: the prerendered public pages and the cabinet under /app/,
# all from one build of web/ (web/dist). scripts/check-site.sh checks every rule written here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers of every response. nginx drops the add_header lines inherited from here as soon as
    # a location has one of its own, so no location below has any: a location sets a variable
    # instead, and an empty value sends no header.
    set $cache_control "no-cache";
    set $robots "";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control;
    add_header X-Robots-Tag $robots;

    # The landing, the policy and other files. HTML is revalidated on every load (no-cache above):
    # it names the hashed files of its build.
    location / {
        try_files $uri $uri/ =404;
    }

    # The English landing lives at /en/ (web/en/index.html).
    location = /en {
        absolute_redirect off;
        return 301 /en/;
    }

    # Account deletion page linked from the app and the Play listing.
    location = /delete-account {
        try_files /delete-account.html =404;
    }

    # Hashed file names: a new build gets new URLs.
    location /assets/ {
        set $cache_control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /img/ {
        set $cache_control "public, max-age=604800";
        try_files $uri =404;
    }

    # Android App Links: the app verifies both hosts against this file, which must be
    # served as JSON without redirects.
    location = /.well-known/assetlinks.json {
        set $cache_control "public, max-age=3600";
        default_type application/json;
    }

    # iOS Universal Links: Apple's CDN fetches this file (no extension) for the app's
    # associated domains on both hosts; JSON, no redirects.
    location = /.well-known/apple-app-site-association {
        set $cache_control "public, max-age=3600";
        default_type application/json;
    }

    # Shared app links without the app: one static page per kind, never the
    # identifier in the text, never indexed.
    location ^~ /u/ {
        set $robots noindex;
        try_files /link/profile.html =404;
    }

    location ^~ /sport/ {
        set $robots noindex;
        try_files /link/sport.html =404;
    }

    # Device pairing link: the fragment holds the device's key and secret and never reaches
    # the server; the page has no script at all.
    location = /pair {
        set $robots noindex;
        try_files /link/pair.html =404;
    }

    # The cabinet: client-side routes fall back to its index.html.
    location = /app {
        absolute_redirect off;
        return 301 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html =404;
    }
}
